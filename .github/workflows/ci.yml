name: CI/CD Pipeline

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  pr-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Playwright tests
        run: npx playwright test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Playwright tests
        run: npx playwright test

  main-ci:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Playwright tests
        run: npx playwright test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Playwright tests
        run: npx playwright test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  staging-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: main-ci
    environment:
      name: staging
    permissions:
      contents: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to staging
        run: echo "Deploying artifact to staging environment"

      - name: Smoke checks
        run: echo "Smoke checks passed"

  production-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: staging-deploy
    environment:
      name: production
    permissions:
      contents: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to production
        run: echo "Deploying artifact to production environment"

      - name: Post-deploy verification
        run: echo "Post-deploy verification passed"
